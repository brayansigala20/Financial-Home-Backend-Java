spring.application.name=financial-home-backend

spring.application.name=financial-home-backend

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financial_home_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Validate the existing schema without automatic changes
spring.jpa.hibernate.ddl-auto=validate

# Disable migrations until the current schema has been reviewed
spring.flyway.enabled=false
