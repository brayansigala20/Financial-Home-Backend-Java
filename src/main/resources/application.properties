spring.application.name=financial-home-backend

spring.application.name=financial-home-backend

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financial_home_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# Evitar cambios automaticos en el esquema existente
spring.jpa.hibernate.ddl-auto=validate

# Desactivar migraciones hasta revisar el esquema actual
spring.flyway.enabled=false
